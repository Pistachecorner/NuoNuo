<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Pistaché Corner Management</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#1f1f1f">
  <link rel="stylesheet" href="styles.css?v=108-pistache-corner">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <div id="loginScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand-mark company-logo-mark" aria-label="Pistaché Corner logo">P</div>
      <p class="eyebrow">PISTACHÉ CORNER · MANAGEMENT</p>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage your shop.</p>
      <form id="loginForm">
        <label>Email<input id="loginEmail" type="email" required autocomplete="email"></label>
        <label>Password<input id="loginPassword" type="password" required autocomplete="current-password"></label>
        <button id="loginSubmit" class="btn btn-dark full" type="submit">Sign in</button>
        <p id="loginError" class="error"></p>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-logo"><div class="brand-mark company-logo-mark" aria-label="Pistaché Corner logo">P</div></div>
        <div class="sidebar-brand-copy"><strong>PISTACHÉ CORNER</strong><span>Management</span></div>
      </div>
      <nav id="sidebarNav">
        <div class="nav-label">OVERVIEW</div>
        <button data-page="dashboard" class="nav-item">Dashboard</button>

        <div class="nav-label">ORDERS</div>
        <button data-page="orders" class="nav-item">Orders</button>
        <button data-page="pending" class="nav-item">Pending Orders</button>

        <div class="nav-label">CATALOG</div>
        <button data-page="menu" class="nav-item">Menu</button>
        <button data-page="ingredients" class="nav-item">Ingredients</button>
        <button data-page="inventory" class="nav-item">Inventory</button>
        <button data-page="wastage" class="nav-item">Wastage</button>
        <button data-page="customers" class="nav-item">Customers</button>

        <div class="nav-label">FINANCE</div>
        <button data-page="sales" class="nav-item">Sales</button>
        <button data-page="expenses" class="nav-item">Expenses</button>
        <button data-page="invoices" class="nav-item">Invoices</button>
        <button data-page="purchasing" class="nav-item">Purchasing</button>
        <button data-page="suppliers" class="nav-item">Suppliers</button>
        <button data-page="movements" class="nav-item">Inventory Movements</button>
        <button data-page="audit" class="nav-item">Audit Log</button>
        <button data-page="partners" class="nav-item">Partners & Profit</button>
        <button data-page="reports" class="nav-item">Reports</button>

        <div class="nav-label">SYSTEM</div>
        <button data-page="settings" class="nav-item">Account Settings</button>
        <button data-page="staff" class="nav-item">Staff</button>
      </nav>
      <div class="sidebar-footer">
        <div id="userEmail" class="small muted"></div>
        <button id="logoutBtn" class="logout">Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">PISTACHÉ CORNER</p>
          <div class="topbar-title-row"><h2 id="pageTitle">Dashboard</h2><span id="activeChannelName" class="active-channel-name"></span></div><div id="liveClock" class="live-clock" aria-live="polite"></div>
        </div>
        <div class="topbar-actions"><label class="global-channel-picker"><span>Channel</span><select id="channelSwitcher" onchange="setActiveChannel(this.value)"><option value="pistache">Pistaché · Nationwide</option><option value="nuonuo">NuoNuo · Local</option></select></label><button id="mobileMenuBtn" class="icon-btn">☰</button></div>
      </header>
      <section id="page" class="page"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <script src="app.js?v=108-pistache-corner"></script>
</body>
</html>
